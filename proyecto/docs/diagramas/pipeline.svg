<path d="M987 704V745" fill="none" stroke="#4a5d63" stroke-width="2.5"  marker-end="url(#f)"/>
<rect x="16" y="924" width="1168" height="218" rx="8" fill="#e6f3ea"/>
<text x="40" y="954" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d6b3d" text-anchor="start">Evaluación y uso</text>
<path d="M213 850V897" fill="none" stroke="#4a5d63" stroke-width="2.5"/>
<path d="M600 850V897" fill="none" stroke="#4a5d63" stroke-width="2.5"/>
<path d="M987 850V897" fill="none" stroke="#4a5d63" stroke-width="2.5"/>
