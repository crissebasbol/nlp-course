<path d="M310 897V965" fill="none" stroke="#4a5d63" stroke-width="2.5"  marker-end="url(#f)"/>
<path d="M890 897V965" fill="none" stroke="#4a5d63" stroke-width="2.5"  marker-end="url(#f)"/>
<rect x="40" y="968" width="540" height="156" rx="6" fill="#ffffff" stroke="#1d6b3d" stroke-width="2"/>
<text x="56" y="999" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d6b3d" text-anchor="start">8. Evaluación</text>
<text x="56" y="1027" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#22343a" text-anchor="start">F1 macro, top 3 y matriz de confusión</text>
<text x="56" y="1051" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#22343a" text-anchor="start">Prueba (2022 a 2025) y prueba temporal (2026)</text>
<text x="56" y="1075" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#22343a" text-anchor="start">Análisis de errores y curva de aprendizaje</text>
<rect x="620" y="968" width="540" height="156" rx="6" fill="#ffffff" stroke="#1d6b3d" stroke-width="2"/>
<text x="636" y="999" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d6b3d" text-anchor="start">9. Predicción y demo (FastAPI)</text>
<text x="636" y="1027" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#22343a" text-anchor="start">Ajuste a la frecuencia real de los segmentos</text>
<text x="636" y="1051" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#22343a" text-anchor="start">Sugerir: 43 Tecnologías, 84% (regresión logística)</text>
<text x="636" y="1075" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#22343a" text-anchor="start">Auditar: marca contratos cuyo segmento</text>
<text x="636" y="1099" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#22343a" text-anchor="start">registrado no coincide con el sugerido</text>
<text x="40" y="1164" font-family="Helvetica, Arial, sans-serif" font-size="14.2" font-weight="400" fill="#526669" text-anchor="start">F1 macro y top 3 en la partición de prueba, sin ajuste. Ejemplo: &quot;Adquisición de 25 computadores portátiles para la secretaría de educación del municipio de Pasto&quot;.</text>
</svg>
