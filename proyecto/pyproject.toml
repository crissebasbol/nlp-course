[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secopedia"
version = "0.1.0"
description = "Clasificador de segmentos UNSPSC para contratos públicos de SECOP II"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"secopedia.web" = ["estaticos/*", "muestra_auditoria.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
